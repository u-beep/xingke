<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- 型刻 项目封面 — 配色与前端主题一致(美团黄) · 网页版界面示意 -->
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#ffc300"/>
    </linearGradient>
    <linearGradient id="blobGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="1" stop-color="#ffe585"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#a86a00" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#a86a00" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="640" fill="#faf9f5"/>
  <circle cx="1150" cy="80" r="170" fill="#fff3c4" opacity="0.7"/>
  <circle cx="80" cy="610" r="130" fill="#fff3c4" opacity="0.55"/>
  <circle cx="700" cy="60" r="30" fill="url(#brandGrad)" opacity="0.35"/>
  <circle cx="55" cy="130" r="13" fill="#ffd84d" opacity="0.5"/>

  <!-- ══ 左侧文字区 ══ -->
  <g>
    <!-- 品牌徽标胶囊 -->
    <rect x="80" y="132" rx="23" ry="23" width="280" height="46" fill="url(#brandGrad)" filter="url(#cardShadow)"/>
    <circle cx="107" cy="155" r="9" fill="#ffffff"/>
    <text x="126" y="163" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" font-weight="600" fill="#1a1a1a">AI 原生 · 身材管理中台</text>

    <!-- 主标题 -->
    <text x="80" y="272" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="86" font-weight="800" fill="#2b2410" letter-spacing="6">型刻</text>

    <!-- 副标题 -->
    <text x="82" y="330" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="25" fill="#6b5d3a">对话式记录饮食 · 管理冰箱 · 规划运动 · 追踪体重</text>

    <!-- 功能标签 -->
    <g font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#6b5d3a">
      <rect x="80" y="372" rx="21" ry="21" width="158" height="42" fill="#ffffff" stroke="#e2d6b3"/>
      <circle cx="105" cy="393" r="6" fill="#ffc300"/>
      <text x="121" y="400">AI 对话</text>

      <rect x="254" y="372" rx="21" ry="21" width="158" height="42" fill="#ffffff" stroke="#e2d6b3"/>
      <circle cx="279" cy="393" r="6" fill="#f5a800"/>
      <text x="295" y="400">饮食记录</text>

      <rect x="428" y="372" rx="21" ry="21" width="158" height="42" fill="#ffffff" stroke="#e2d6b3"/>
      <circle cx="453" cy="393" r="6" fill="#2ba471"/>
      <text x="469" y="400">冰箱食材</text>

      <rect x="80" y="430" rx="21" ry="21" width="158" height="42" fill="#ffffff" stroke="#e2d6b3"/>
      <circle cx="105" cy="451" r="6" fill="#2f8bd6"/>
      <text x="121" y="458">运动活动</text>

      <rect x="254" y="430" rx="21" ry="21" width="158" height="42" fill="#ffffff" stroke="#e2d6b3"/>
      <circle cx="279" cy="451" r="6" fill="#e8453c"/>
      <text x="295" y="458">外卖分析</text>

      <rect x="428" y="430" rx="21" ry="21" width="158" height="42" fill="#ffffff" stroke="#e2d6b3"/>
      <circle cx="453" cy="451" r="6" fill="#a86a00"/>
      <text x="469" y="458">数据看板</text>
    </g>
  </g>

  <!-- ══ 右侧网页界面示意 ══ -->
  <g>
    <!-- 背景大圆 -->
    <circle cx="985" cy="330" r="248" fill="url(#blobGrad)"/>

    <!-- 浏览器窗口 -->
    <rect x="760" y="110" width="440" height="420" rx="16" fill="#ffffff" stroke="#e2d6b3" stroke-width="2" filter="url(#cardShadow)"/>

    <!-- 浏览器顶栏 -->
    <circle cx="788" cy="136" r="6" fill="#ff8f85"/>
    <circle cx="810" cy="136" r="6" fill="#ffd84d"/>
    <circle cx="832" cy="136" r="6" fill="#7ed3a0"/>
    <rect x="856" y="123" width="320" height="26" rx="13" fill="#faf9f5" stroke="#f0e9d6"/>
    <circle cx="873" cy="136" r="5" fill="#ffc300"/>
    <text x="886" y="141" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#a89770">型刻 · AI 身材管理</text>
    <line x1="760" y1="158" x2="1200" y2="158" stroke="#f0e9d6" stroke-width="2"/>

    <!-- 侧边导航(tab 图标) -->
    <rect x="760" y="158" width="58" height="372" fill="#fffdf5"/>
    <!-- 首页(选中) -->
    <rect x="777" y="182" width="24" height="24" rx="7" fill="url(#brandGrad)"/>
    <circle cx="784.5" cy="190" r="2.2" fill="#ffffff"/>
    <circle cx="793.5" cy="190" r="2.2" fill="#ffffff"/>
    <circle cx="784.5" cy="198" r="2.2" fill="#ffffff"/>
    <circle cx="793.5" cy="198" r="2.2" fill="#ffffff"/>
    <!-- 对话 -->
    <rect x="777" y="230" width="24" height="24" rx="7" fill="#f0e9d6"/>
    <rect x="782" y="236" width="14" height="9" rx="4" fill="#ffffff"/>
    <path d="M785 244 l3 3 l3 -3 Z" fill="#ffffff"/>
    <!-- 冰箱 -->
    <rect x="777" y="278" width="24" height="24" rx="7" fill="#f0e9d6"/>
    <rect x="783" y="282" width="12" height="16" rx="2" fill="#ffffff"/>
    <line x1="783" y1="289" x2="795" y2="289" stroke="#f0e9d6" stroke-width="1.5"/>
    <!-- 运动活动(绿色高亮) -->
    <rect x="777" y="326" width="24" height="24" rx="7" fill="#2ba471"/>
    <rect x="782" y="337" width="14" height="2.5" rx="1.2" fill="#ffffff"/>
    <rect x="781" y="333" width="3.5" height="10" rx="1.5" fill="#ffffff"/>
    <rect x="793.5" y="333" width="3.5" height="10" rx="1.5" fill="#ffffff"/>
    <!-- 看板 -->
    <rect x="777" y="374" width="24" height="24" rx="7" fill="#f0e9d6"/>
    <rect x="783" y="388" width="3" height="8" rx="1" fill="#ffffff"/>
    <rect x="788" y="384" width="3" height="12" rx="1" fill="#ffffff"/>
    <rect x="793" y="380" width="3" height="16" rx="1" fill="#ffffff"/>
    <!-- 我的 -->
    <rect x="777" y="422" width="24" height="24" rx="7" fill="#f0e9d6"/>
    <circle cx="789" cy="431" r="3.5" fill="#ffffff"/>
    <path d="M783 443 q6 -9 12 0 Z" fill="#ffffff"/>

    <!-- 页头 -->
    <text x="842" y="196" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#2b2410">今日概览</text>
    <rect x="1108" y="176" width="72" height="26" rx="13" fill="#fff7e0"/>
    <text x="1118" y="194" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#a86a00">8 月 31 日</text>

    <!-- 统计卡1:热量环 -->
    <rect x="842" y="214" width="176" height="112" rx="12" fill="#ffffff" stroke="#f0e9d6" filter="url(#softShadow)"/>
    <circle cx="884" cy="268" r="26" fill="none" stroke="#fff3c4" stroke-width="8"/>
    <circle cx="884" cy="268" r="26" fill="none" stroke="#ffc300" stroke-width="8" stroke-linecap="round" stroke-dasharray="118 164" transform="rotate(-90 884 268)"/>
    <text x="922" y="262" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#a89770">今日热量</text>
    <text x="922" y="284" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#2b2410">1,860 <tspan font-size="12" font-weight="400" fill="#a89770">kcal</tspan></text>

    <!-- 统计卡2:体重 -->
    <rect x="1032" y="214" width="148" height="112" rx="12" fill="#ffffff" stroke="#f0e9d6" filter="url(#softShadow)"/>
    <text x="1048" y="242" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#a89770">最新体重</text>
    <text x="1048" y="272" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2b2410">65.2 <tspan font-size="12" font-weight="400" fill="#a89770">kg</tspan></text>
    <path d="M1048 282 l10 0 l0 8 l8 0 l-13 10 l-13 -10 l8 0 Z" fill="#2ba471"/>
    <text x="1076" y="296" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#2ba471">较上周 -0.4</text>

    <!-- 对话区 -->
    <rect x="842" y="344" rx="11" ry="11" width="230" height="34" fill="#fff3c4"/>
    <text x="856" y="366" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6b5d3a">记录：午饭吃了米饭和鸡胸肉</text>
    <rect x="990" y="390" rx="11" ry="11" width="150" height="34" fill="url(#brandGrad)"/>
    <text x="1002" y="412" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1a1a1a">已记录 350 kcal ✓</text>

    <!-- 迷你柱状图 -->
    <g>
      <rect x="842" y="486" width="16" height="26" rx="4" fill="#ffe585"/>
      <rect x="868" y="472" width="16" height="40" rx="4" fill="#ffd84d"/>
      <rect x="894" y="480" width="16" height="32" rx="4" fill="#ffe585"/>
      <rect x="920" y="462" width="16" height="50" rx="4" fill="#ffc300"/>
      <rect x="946" y="470" width="16" height="42" rx="4" fill="#ffd84d"/>
      <rect x="972" y="464" width="16" height="48" rx="4" fill="#ffc300"/>
      <line x1="842" y1="514" x2="1180" y2="514" stroke="#f0e9d6" stroke-width="2"/>
    </g>

    <!-- 右侧迷你卡片:运动活动(加入即进群聊) -->
    <rect x="1010" y="446" width="170" height="62" rx="10" fill="#fff7e0"/>
    <text x="1024" y="466" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#6b5d3a">羽毛球局 · 报名中</text>
    <circle cx="1031" cy="489" r="7" fill="#ffd84d" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="1042" cy="489" r="7" fill="#ffe585" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="1053" cy="489" r="7" fill="#ffc300" stroke="#ffffff" stroke-width="1.5"/>
    <text x="1067" y="493" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="11" fill="#a89770">5/8 人 · 进群聊</text>

    <!-- 浮动卡片:体重趋势 -->
    <g filter="url(#cardShadow)">
      <rect x="1146" y="330" rx="14" ry="14" width="130" height="104" fill="#ffffff"/>
      <text x="1162" y="358" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#a89770">体重趋势</text>
      <polyline points="1160,372 1180,384 1200,378 1222,394 1244,402 1262,408" fill="none" stroke="#2ba471" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="1262" cy="408" r="5" fill="#2ba471"/>
    </g>

    <!-- 浮动卡片:冰箱 -->
    <g filter="url(#cardShadow)">
      <rect x="668" y="428" rx="14" ry="14" width="130" height="120" fill="#ffffff"/>
      <rect x="698" y="448" width="70" height="80" rx="10" fill="url(#brandGrad)"/>
      <line x1="698" y1="480" x2="768" y2="480" stroke="#ffffff" stroke-width="4"/>
      <rect x="756" y="458" width="5" height="16" rx="2.5" fill="#1a1a1a"/>
      <rect x="756" y="490" width="5" height="16" rx="2.5" fill="#1a1a1a"/>
      <path d="M683 440 q6 -14 20 -10 q-2 16 -20 10 Z" fill="#2ba471"/>
    </g>

    <!-- 浮动卡片:热量环(大) -->
    <g filter="url(#cardShadow)">
      <rect x="648" y="152" rx="14" ry="14" width="150" height="106" fill="#ffffff"/>
      <circle cx="696" cy="205" r="28" fill="none" stroke="#fff3c4" stroke-width="9"/>
      <circle cx="696" cy="205" r="28" fill="none" stroke="#ffc300" stroke-width="9" stroke-linecap="round" stroke-dasharray="124 176" transform="rotate(-90 696 205)"/>
      <text x="738" y="196" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#a89770">目标进度</text>
      <text x="738" y="218" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#2b2410">78%</text>
    </g>
  </g>
</svg>
