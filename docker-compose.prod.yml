# 生产部署编排: 数据服务 + 后端 API + 前端 Web
# 前置: 项目根目录需要存在 .env 文件(含模型 API Key, 与本地开发共用同一份)
# 使用: docker compose -f docker-compose.prod.yml up -d --build

name: xingke

networks:
  shapeai-net:
    name: shapeai-net
    driver: bridge

volumes:
  pgdata:
  redis_data:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
  shapeai_data:    # /app/data     知识库文件
  shapeai_state:   # /app/.shapeai 会话/记忆/运行记录

services:
  # ─── PostgreSQL + pgvector (主数据库) ───
  postgres:
    image: pgvector/pgvector:pg16
    container_name: xingke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shapeai
      POSTGRES_PASSWORD: shapeai123
      POSTGRES_DB: shapeai
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shapeai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shapeai"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ─── Redis (缓存/短期记忆) ───
  redis:
    image: redis:7-alpine
    container_name: xingke-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - shapeai-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ─── MySQL (PG 同步副本, 只读分析) ───
  mysql:
    image: mysql:8.0.32
    container_name: xingke-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: shapeai
      MYSQL_USER: shapeai
      MYSQL_PASSWORD: shapeai123
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shapeai-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 24

  # ─── etcd (Milvus 元数据依赖) ───
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: xingke-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd_data:/etcd
    networks:
      - shapeai-net
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  # ─── MinIO (对象存储: Milvus 存储 + 冰箱食材图片) ───
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: xingke-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/minio/data
    networks:
      - shapeai-net
    command: minio server /minio/data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ─── Milvus (向量检索/知识库) ───
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: xingke-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - shapeai-net
    depends_on:
      - etcd
      - minio

  # ─── 后端 API (FastAPI, 端口 28900) ───
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xingke-api
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器网络内直连各数据服务(覆盖 .env 与代码默认值中的 localhost/开发端口)
      SHAPEAI_HOST: 0.0.0.0
      SHAPEAI_PORT: "28900"
      SHAPEAI_PG_HOST: postgres
      SHAPEAI_PG_PORT: "5432"
      SHAPEAI_REDIS_HOST: redis
      SHAPEAI_REDIS_PORT: "6379"
      SHAPEAI_MYSQL_HOST: mysql
      SHAPEAI_MYSQL_PORT: "3306"
      SHAPEAI_MILVUS_HOST: milvus
      SHAPEAI_MINIO_ENDPOINT: minio:9000
    volumes:
      - shapeai_data:/app/data
      - shapeai_state:/app/.shapeai
    networks:
      - shapeai-net
    ports:
      - "127.0.0.1:28900:28900"   # 仅服务器本机可访问(调试用); 外部流量统一走 web 容器
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus:
        condition: service_started

  # ─── 前端 Web (Nginx: 静态托管 + API 反向代理, 端口 80) ───
  web:
    build:
      context: ./xingke_frontend
      dockerfile: Dockerfile
    container_name: xingke-web
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - shapeai-net
    depends_on:
      - api
