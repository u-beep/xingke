[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shapeai"
version = "0.1.0"
description = "ShapeAI - 身材管理AI中台: 独立部署的AI能力服务集群"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.0",
  "numpy>=1.26.0",
  "psycopg2-binary>=2.9.0",
  "redis>=5.0.0",
  "pymilvus>=2.4.0",
  "pymysql>=1.1.0",
  "dbutils>=3.1.0",
  "minio>=7.2.0",
]

[project.scripts]
shapeai = "shapeai.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.4.4",
  "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["shapeai*"]
